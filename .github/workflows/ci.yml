name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: Code Quality (parallel with Stage 2) ─────────────
  backend-quality:
    name: "Stage 1 · Backend Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff mypy pytest-cov pytest-asyncio

      - name: Compile check
        run: find backend/app -name '*.py' -print0 | xargs -0 python -m py_compile

      - name: Lint (ruff)
        run: ruff check --output-format=github backend/

      - name: Type check (mypy)
        working-directory: backend
        run: python -m mypy app --ignore-missing-imports
        continue-on-error: true # advisory — unresolved third-party stubs

      - name: Tests + coverage (100% gate)
        working-directory: backend
        run: |
          pytest --cov=app --cov-report=term-missing \
                 --cov-report=xml:coverage.xml --cov-fail-under=100 -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          echo "## 🧪 Backend Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python -m coverage report --format=text >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  frontend-quality:
    name: "Stage 1 · Frontend Quality"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── STAGE 2: Security Gate (parallel with Stage 1) ────────────
  secret-scan:
    name: "Stage 2 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: pip-audit (backend CVEs)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true # advisory — don't block on unpatched upstream

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm audit (high + critical)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true # transitive dev-dep noise

      - name: License compliance check
        working-directory: frontend
        run: npx license-checker --production --failOn "GPL-3.0;AGPL-3.0" --summary
        continue-on-error: true

  # ── STAGE 3: Build Verification ───────────────────────────────
  build:
    name: "Stage 3 · Build (${{ matrix.service }})"
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: backend
            file: backend/Dockerfile
          - service: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - name: Docker build verification — ${{ matrix.service }}
        run: docker build -f ${{ matrix.file }} ${{ matrix.context }}

  # ── STAGE 4: E2E Tests ────────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E Tests"
    needs: [frontend-quality]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      # E2E runs the dashboard shell with NO backend reachable — it verifies the
      # UI degrades correctly rather than crashing. Full-stack flows require live
      # LLM + Supabase credentials and are exercised by scripts/capture-screenshots.mjs.
      - name: Run E2E tests
        run: npx playwright test
        env:
          NODE_ENV: production

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  # ── STAGE 5: Deploy Gate (main only) ──────────────────────────
  deploy-gate:
    name: "Stage 5 · Deploy Gate"
    needs: [build, e2e, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: All gates passed
        run: |
          echo "🛡️  All CI/CD gates passed!"
          echo ""
          echo "Pipeline Summary:"
          echo "  ✅ Stage 1 — Backend Quality (ruff, mypy, pytest @ 100%)"
          echo "  ✅ Stage 1 — Frontend Quality (eslint, tsc, vitest + coverage)"
          echo "  ✅ Stage 2 — Secret Scanning (TruffleHog, full history)"
          echo "  ✅ Stage 2 — Dependency Audit (pip-audit, npm audit, licenses)"
          echo "  ✅ Stage 3 — Build Verification (backend + frontend images)"
          echo "  ✅ Stage 4 — E2E Tests (Playwright)"
