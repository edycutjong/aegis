name: Commit Lint

# Semantic versioning is only as reliable as the commit messages it reads.
# This gate keeps `release-please` able to compute the next version correctly.
#
# The PR *title* is what matters: this repo squash-merges, so the PR title
# becomes the commit message on main that release-please parses.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: PR title is a conventional commit
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            test
            docs
            build
            ci
            chore
            style
            revert
          # Optional scopes matching the repo's layout.
          scopes: |
            backend
            frontend
            agent
            api
            cache
            router
            observability
            ci
            docker
            docs
            deps
            security
          requireScope: false
          subjectPattern: ^(?![A-Z])(?!.*\.$).+$
          subjectPatternError: |
            The subject "{subject}" is invalid for the "{type}" type.
            It must start with a lowercase letter and must not end with a period.
